# Licensed as the repository it is in (REUSE.toml annotates .github/**).
# Template from VRAISON/outcome-workspace github/templates/ci.yml. `ci-required` is the
# check named in the organization ruleset; it `needs:` every other job, so a repository
# adds its build and test jobs and lists them there.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
defaults:
  run:
    # -eo pipefail: a step piped through tee fails when its command does
    shell: bash
jobs:
  licensing:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: SPDX headers (reuse lint)
        # Repositories without REUSE.toml (proprietary ones) carry no SPDX check.
        run: |
          if [ -f REUSE.toml ]; then pipx run --spec 'reuse[charset-normalizer]==6.2.0' reuse lint; else echo "no REUSE.toml: skipped"; fi
      - name: Secrets (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSLo gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git . --no-banner --redact
  # F-0017-T4 (@ac-6): the formula, rendered from Formula/out.rb.tmpl for the newest release
  # in the public RunOutcome/releases (a pre-release counts), installed from this checkout
  # tapped as runoutcome/tap on the runner. This repository is public and holds no secrets,
  # so it tests published binaries, never the internal source (adr-0058). Before the first
  # release there is nothing to install, and the job says so and passes.
  # Nothing is published (@ac-7).
  formula:
    runs-on: macos-latest
    env:
      RELEASE_REPO: RunOutcome/releases
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_FROM_API: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The newest release in RunOutcome/releases, and its checksums.txt
        env:
          # read-only, for the public repository's release list
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh api "repos/$RELEASE_REPO/releases?per_page=1" --jq '.[0].tag_name // empty')"
          if [ -z "$tag" ]; then
            echo "::notice::$RELEASE_REPO has no release yet: nothing to install, formula checks skipped"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/assets"
          curl -fsSL -o "$RUNNER_TEMP/assets/checksums.txt" "https://github.com/$RELEASE_REPO/releases/download/$tag/checksums.txt"
          cat "$RUNNER_TEMP/assets/checksums.txt"
          { echo "TAG=$tag"; echo "VERSION=${tag#v}"; } >> "$GITHUB_ENV"
      - name: render the formula, and tap this checkout (a local tap; nothing is pushed)
        if: env.TAG != ''
        run: |
          scripts/render-formula.sh --version "$TAG" --base-url "https://github.com/$RELEASE_REPO/releases/download/$TAG" --checksums "$RUNNER_TEMP/assets/checksums.txt"
          # brew tap clones a path tap, so it reads only committed files: the rendered formula is
          # committed on a branch that exists only in this runner's checkout.
          git checkout -q -b ci-rendered-formula
          git add -f Formula/out.rb
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "ci: the rendered formula (runner only, never pushed)"
          brew tap runoutcome/tap "$GITHUB_WORKSPACE"
          sed -n '1,40p' "$(brew --repository runoutcome/tap)/Formula/out.rb"
      - name: brew audit --strict (only URL notes may be reported)
        if: env.TAG != ''
        run: |
          set +e
          brew audit --formula --strict runoutcome/tap/out > "$RUNNER_TEMP/audit.txt" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/audit.txt"
          problems="$(grep -E '^ *\* ' "$RUNNER_TEMP/audit.txt" | grep -viE 'file://|url|https' || true)"
          if [ -n "$problems" ]; then echo "refused: brew audit reported more than URL notes:"; echo "$problems"; exit 1; fi
          echo "brew audit exit $code; nothing reported but URL notes"
      - name: "@ac-6: a clean PATH gets out and outsh"
        if: env.TAG != ''
        run: |
          prefix="$(brew --prefix)"
          brew install runoutcome/tap/out 2>&1 | tee "$RUNNER_TEMP/row1.txt"
          [ "$(readlink "$prefix/opt/out/bin/outsh")" = out ] || { echo "refused: outsh is not a link to out"; exit 1; }
          command -v outsh
          out --version | grep -qx "out $VERSION (.*)" || { echo "refused: out --version is not $VERSION"; exit 1; }
      - name: "@ac-6: out up --native, a user and a login, out status"
        if: env.TAG != ''
        run: scripts/ci/up-login-status.sh "row1"
      - name: "brew uninstall and cleanup --prune-prefix leave no out or outsh"
        if: env.TAG != ''
        run: |
          out stop || true
          brew uninstall --formula out
          brew cleanup --prune-prefix
          prefix="$(brew --prefix)"
          for n in out outsh; do [ ! -e "$prefix/bin/$n" ] && [ ! -L "$prefix/bin/$n" ] || { echo "refused: $prefix/bin/$n is left"; exit 1; }; echo "gone: $prefix/bin/$n"; done
          rm -rf "$HOME/.outcome"
      - if: always()
        name: stop out
        run: command -v out >/dev/null && out stop || true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formula-ac-6
          path: |
            ${{ runner.temp }}/row*.txt
            ${{ runner.temp }}/audit.txt
            ${{ runner.temp }}/assets/checksums.txt
            Formula/out.rb
          if-no-files-found: warn
  ci-required:
    if: always()
    needs: [licensing, formula]
    runs-on: ubuntu-24.04
    steps:
      - name: All required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do [ "$r" = success ] || { echo "refused: a required job ended $r"; exit 1; }; done
